name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · 100% per-line coverage · path-dep gate.
  #
  # No inputs: this repo already enforced a 100% per-line gate at
  # `--workspace --all-features`, which is exactly the shared workflow's default,
  # and MSRV is read from rust-version. Anything that needed configuring would be
  # a behaviour change smuggled in by an adoption PR, so there is nothing here.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@9234e1fa9f85b14a8d6fddc7a8f7378f7e30b183
    with:
      # CARRIED ACROSS UNCHANGED. This repo did NOT enforce a 100% per-line gate —
      # it enforced an aggregate 92% line floor, deliberately and with a written
      # rationale: the residual uncovered lines are panic-free defensive guards and
      # env-gated paths that only a real snapshot-bearing / deep-B-tree /
      # corrupt-superblock image reaches, and annotating reachable code
      # `// cov:unreachable` would be dishonest.
      #
      # Inheriting the fleet's strict gate here would have been a behaviour change
      # smuggled in by an adoption PR — it fails on 11 defensive arms that the
      # previous gate deliberately tolerated. Adoption carries the decision over;
      # tightening it is a separate change that has to argue for itself.
      #
      # REMOVE WHEN: those paths are reachable by committed fixtures, or the
      # provably-dead arms carry `// cov:unreachable: <invariant>` and this repo
      # can inherit `coverage-gate: strict`.
      coverage-gate: floor
      coverage-floor: 92
